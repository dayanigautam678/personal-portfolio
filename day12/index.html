<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1> Guess the Number!</h1>
        <p class="instruction">Guess a number between 1 and 20.</p>

        <div class="game-info">
            <div class="info-box">
                <span>Attempts Left</span>
                <strong id="attempts">5</strong>
            </div>

            <div class="info-box">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>
        </div>

        <input type="number" id="guessInput" min="1" max="20" placeholder="Enter your guess">

        <button id="checkBtn">Check Guess</button>

        <p id="message">Good luck! Start guessing.</p>

        <button id="playAgainBtn" hidden>Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
