
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .gallery-container {
            width: 100%;
            max-width: 650px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #222;
            margin-bottom: 25px;
        }

        #galleryImage {
    width: 100%;
    height: 350px;
    object-fit: contain;
    background-color: #f1f1f1;
    border-radius: 12px;
    transition: 0.3s;
}

        #galleryImage:hover {
            transform: scale(1.02);
        }

        #caption {
            margin: 15px 0 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        #imageNumber {
            color: #777;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #5b5bd6;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3939a8;
            transform: translateY(-2px);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
        }

        .dot {
            width: 12px;
            height: 12px;
            padding: 0;
            border-radius: 50%;
            background: #ccc;
        }

        .dot.active {
            background: #5b5bd6;
            transform: scale(1.25);
        }

        @media (max-width: 480px) {
            .gallery-container {
                padding: 20px 15px;
            }

            #galleryImage {
                height: 230px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                padding: 11px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="gallery-container">
        <h1>My Image Gallery</h1>

        <img id="galleryImage" src="" alt="Gallery Image">

        <div id="caption"></div>
        <div id="imageNumber"></div>

        <div class="controls">
            <button id="previous">Previous</button>
            <button id="next">Next</button>
            <button id="playPause">Play Slideshow</button>
        </div>

        <div class="dots" id="dots"></div>
    </div>

    <script>
        const images = [
            {
                src: "Ganpati-bapa.jpeg",
                caption: "Ganpati Bapa"
            },
            {
                src: "cute-couple.jpeg",
                caption: "best couple in the world"
            },
            {
                src: "BMW.jpeg",
                caption: "My Favorite Car"
            },
            {
                src: "Tanjiro.jpeg",
                caption: "Character of demon slayer "
            }
        ];

        let currentIndex = 0;
        let slideshow = null;

        const galleryImage = document.getElementById("galleryImage");
        const caption = document.getElementById("caption");
        const imageNumber = document.getElementById("imageNumber");
        const dotsContainer = document.getElementById("dots");
        const playPauseButton = document.getElementById("playPause");

        function displayImage() {
            galleryImage.src = images[currentIndex].src;
            galleryImage.alt = images[currentIndex].caption;

            caption.textContent = images[currentIndex].caption;

            imageNumber.textContent =
                `Image ${currentIndex + 1} of ${images.length}`;

            document.querySelectorAll(".dot").forEach(function(dot, index) {
                dot.classList.toggle("active", index === currentIndex);
            });
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            displayImage();
        }

        function previousImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            displayImage();
        }

        function createDots() {
            images.forEach(function(image, index) {
                const dot = document.createElement("button");

                dot.className = "dot";
                dot.setAttribute("aria-label", "Show image " + (index + 1));

                dot.addEventListener("click", function() {
                    currentIndex = index;
                    displayImage();
                });

                dotsContainer.appendChild(dot);
            });
        }

        function toggleSlideshow() {
            if (slideshow === null) {
                slideshow = setInterval(nextImage, 2500);
                playPauseButton.textContent = "Pause Slideshow";
            } else {
                clearInterval(slideshow);
                slideshow = null;
                playPauseButton.textContent = "Play Slideshow";
            }
        }

        document.getElementById("next").addEventListener("click", nextImage);

        document.getElementById("previous").addEventListener("click", previousImage);

        playPauseButton.addEventListener("click", toggleSlideshow);

        createDots();
        displayImage();
    </script>

</body>
</html>
