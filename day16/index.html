
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MintCalc - Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Trebuchet MS',Arial,sans-serif;
    background:#e8f1e9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.calculator{
    width:100%;
    max-width:370px;
    background:#ffffff;
    padding:28px;
    border-radius:30px;
    box-shadow:0 20px 50px #315b4320;
    border:1px solid #dce9dd;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h2{
    color:#24543b;
    font-size:23px;
}

.header span{
    background:#dff3e4;
    color:#367b51;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
}

#display{
    width:100%;
    height:100px;
    border:none;
    outline:none;
    background:#edf5ee;
    border-radius:20px;
    padding:20px;
    text-align:right;
    font-size:35px;
    color:#24543b;
    margin-bottom:24px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:65px;
    border:none;
    border-radius:18px;
    background:#edf4ee;
    color:#315c40;
    font-size:21px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#d5e9d9;
    transform:translateY(-3px);
}

button:active{
    transform:scale(.94);
}

.operator{
    background:#d9eee0;
    color:#287447;
}

.operator:hover{
    background:#bde2c8;
}

.clear{
    background:#ffe5dd;
    color:#d45c43;
}

.clear:hover{
    background:#ffd1c4;
}

.backspace{
    background:#fff0d7;
    color:#b17a24;
}

.backspace:hover{
    background:#ffe2ad;
}

.equal{
    background:#317c51;
    color:white;
    grid-row:span 2;
    height:142px;
    font-size:27px;
}

.equal:hover{
    background:#245f3d;
}

.zero{
    grid-column:span 2;
}

.footer{
    text-align:center;
    color:#8a9e8e;
    font-size:12px;
    margin-top:22px;
}

@media(max-width:400px){
    .calculator{
        padding:20px;
    }

    button{
        height:58px;
    }

    .equal{
        height:128px;
    }
}
</style>
</head>

<body>

<div class="calculator">

<div class="header">
<h2>MintCalc</h2>
<span>SMART CALCULATOR</span>
</div>

<input type="text" id="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>
<button class="backspace" onclick="deleteLast()">⌫</button>
<button class="operator" onclick="chooseOperator('/')">÷</button>
<button class="operator" onclick="chooseOperator('*')">×</button>

<button onclick="appendNumber('7')">7</button>
<button onclick="appendNumber('8')">8</button>
<button onclick="appendNumber('9')">9</button>
<button class="operator" onclick="chooseOperator('-')">−</button>

<button onclick="appendNumber('4')">4</button>
<button onclick="appendNumber('5')">5</button>
<button onclick="appendNumber('6')">6</button>
<button class="operator" onclick="chooseOperator('+')">+</button>

<button onclick="appendNumber('1')">1</button>
<button onclick="appendNumber('2')">2</button>
<button onclick="appendNumber('3')">3</button>
<button class="equal" onclick="calculate()">=</button>

<button class="zero" onclick="appendNumber('0')">0</button>
<button onclick="appendDecimal()">.</button>

</div>

<div class="footer">
<p>Simple calculations, smarter results.</p>
</div>

</div>

<script>
const display=document.getElementById("display");

let currentInput="0";
let previousInput="";
let operator=null;
let resetScreen=false;

function updateDisplay(){
    display.value=currentInput;
}

function appendNumber(number){

    if(currentInput==="Error"){
        clearDisplay();
    }

    if(resetScreen){
        currentInput=number;
        resetScreen=false;
    }else{
        currentInput=currentInput==="0"?number:currentInput+number;
    }

    updateDisplay();
}

function appendDecimal(){

    if(currentInput==="Error"){
        clearDisplay();
    }

    if(resetScreen){
        currentInput="0.";
        resetScreen=false;
    }else if(!currentInput.includes(".")){
        currentInput+=".";
    }

    updateDisplay();
}

function chooseOperator(selectedOperator){

    if(currentInput==="Error")return;

    if(operator!==null&&!resetScreen){
        calculate();
    }

    previousInput=currentInput;
    operator=selectedOperator;
    resetScreen=true;
}

function calculate(){

    if(operator===null||resetScreen)return;

    const first=Number(previousInput);
    const second=Number(currentInput);
    let result;

    switch(operator){

        case "+":
            result=first+second;
            break;

        case "-":
            result=first-second;
            break;

        case "*":
            result=first*second;
            break;

        case "/":
            if(second===0){
                currentInput="Error";
                previousInput="";
                operator=null;
                resetScreen=true;
                updateDisplay();
                return;
            }
            result=first/second;
            break;
    }

    currentInput=String(Number(result.toPrecision(12)));
    previousInput="";
    operator=null;
    resetScreen=true;
    updateDisplay();
}

function clearDisplay(){

    currentInput="0";
    previousInput="";
    operator=null;
    resetScreen=false;
    updateDisplay();
}

function deleteLast(){

    if(currentInput==="Error"){
        clearDisplay();
        return;
    }

    if(resetScreen){
        currentInput="0";
        resetScreen=false;
    }else{
        currentInput=currentInput.length>1?
        currentInput.slice(0,-1):"0";
    }

    updateDisplay();
}
</script>

</body>
</html>
