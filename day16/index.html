
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.calculator{
    width:100%;
    max-width:350px;
    background:#1d2635;
    padding:25px;
    border-radius:22px;
    box-shadow:0 15px 40px #0008;
}

h2{
    color:white;
    text-align:center;
    margin-bottom:22px;
    letter-spacing:2px;
}

#display{
    width:100%;
    height:80px;
    background:#101722;
    border:none;
    border-radius:12px;
    color:white;
    font-size:32px;
    text-align:right;
    padding:15px;
    margin-bottom:20px;
    outline:none;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:62px;
    border:none;
    border-radius:12px;
    background:#34445b;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#526782;
    transform:scale(1.04);
}

.operator{
    background:#f39c35;
}

.operator:hover{
    background:#d9821f;
}

.clear{
    background:#e74c3c;
}

.clear:hover{
    background:#c0392b;
}

.equal{
    background:#20a779;
    grid-row:span 2;
    height:136px;
}

.equal:hover{
    background:#16865f;
}

.zero{
    grid-column:span 2;
}
</style>
</head>

<body>

<div class="calculator">

<h2>CALCULATOR</h2>

<input type="text" id="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button class="operator" onclick="chooseOperator('/')">÷</button>
<button class="operator" onclick="chooseOperator('*')">×</button>

<button onclick="appendNumber('7')">7</button>
<button onclick="appendNumber('8')">8</button>
<button onclick="appendNumber('9')">9</button>
<button class="operator" onclick="chooseOperator('-')">−</button>

<button onclick="appendNumber('4')">4</button>
<button onclick="appendNumber('5')">5</button>
<button onclick="appendNumber('6')">6</button>
<button class="operator" onclick="chooseOperator('+')">+</button>

<button onclick="appendNumber('1')">1</button>
<button onclick="appendNumber('2')">2</button>
<button onclick="appendNumber('3')">3</button>
<button class="equal" onclick="calculate()">=</button>

<button class="zero" onclick="appendNumber('0')">0</button>
<button onclick="appendDecimal()">.</button>

</div>
</div>

<script>
const display=document.getElementById("display");

let currentInput="0";
let previousInput="";
let operator=null;
let resetScreen=false;

function updateDisplay(){
    display.value=currentInput;
}

function appendNumber(number){

    if(currentInput==="Error"){
        clearDisplay();
    }

    if(resetScreen){
        currentInput=number;
        resetScreen=false;
    }
    else{
        currentInput=currentInput==="0"?number:currentInput+number;
    }

    updateDisplay();
}

function appendDecimal(){

    if(currentInput==="Error"){
        clearDisplay();
    }

    if(resetScreen){
        currentInput="0.";
        resetScreen=false;
    }
    else if(!currentInput.includes(".")){
        currentInput+=".";
    }

    updateDisplay();
}

function chooseOperator(selectedOperator){

    if(currentInput==="Error")return;

    if(operator!==null&&!resetScreen){
        calculate();
    }

    previousInput=currentInput;
    operator=selectedOperator;
    resetScreen=true;
}

function calculate(){

    if(operator===null||resetScreen)return;

    const first=Number(previousInput);
    const second=Number(currentInput);
    let result;

    switch(operator){

        case "+":
            result=first+second;
            break;

        case "-":
            result=first-second;
            break;

        case "*":
            result=first*second;
            break;

        case "/":
            if(second===0){
                currentInput="Error";
                previousInput="";
                operator=null;
                resetScreen=true;
                updateDisplay();
                return;
            }
            result=first/second;
            break;
    }

    currentInput=String(Number(result.toPrecision(12)));
    previousInput="";
    operator=null;
    resetScreen=true;
    updateDisplay();
}

function clearDisplay(){
    currentInput="0";
    previousInput="";
    operator=null;
    resetScreen=false;
    updateDisplay();
}

function deleteLast(){

    if(currentInput==="Error"){
        clearDisplay();
        return;
    }

    if(resetScreen){
        currentInput="0";
        resetScreen=false;
    }
    else{
        currentInput=currentInput.length>1?
        currentInput.slice(0,-1):"0";
    }

    updateDisplay();
}
</script>

</body>
</html>
