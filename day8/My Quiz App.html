
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Quiz App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .quiz-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #fc0404;
            margin-bottom: 25px;
        }

        .question {
            margin-bottom: 22px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .question h3 {
            margin-bottom: 12px;
            color: blue ;
        }

        .option {
            display: block;
            padding: 9px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
        }

        .option:hover {
            background: #e0e7ff;
        }

        .option input {
            margin-right: 8px;
            cursor: pointer;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #3730a3;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #dc2626;
        }

        #result {
            display: none;
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        #result h2 {
            color: #047857;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1>My Quiz App</h1>

        <form id="quizForm">

            <div class="question">
                <h3><b>1. Which language is used to style a webpage?</b></h3>

                <label class="option">
                    <input type="radio" name="q1" value="a"> HTML
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="b"> CSS
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="c"> Python
                </label>

                <label class="option">
                    <input type="radio" name="q1" value="d"> Java
                </label>
            </div>

            <div class="question">
                <h3><b>2. What does HTML stand for?</b></h3>

                <label class="option">
                    <input type="radio" name="q2" value="a"> High Text Machine Language
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="b"> Hyper Text Markup Language
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="c"> Home Tool Markup Language
                </label>

                <label class="option">
                    <input type="radio" name="q2" value="d"> Hyperlinks Text Management Language
                </label>
            </div>

            <div class="question">
                <h3><b>3. Which language is used for webpage interaction?</b></h3>

                <label class="option">
                    <input type="radio" name="q3" value="a"> CSS
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="b"> HTML
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="c"> JavaScript
                </label>

                <label class="option">
                    <input type="radio" name="q3" value="d"> SQL
                </label>
            </div>

            <div class="question">
                <h3><b>4. Which HTML tag creates a hyperlink?</b></h3>

                <label class="option">
                    <input type="radio" name="q4" value="a"> &lt;img&gt;
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="b"> &lt;p&gt;
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="c"> &lt;h1&gt;
                </label>

                <label class="option">
                    <input type="radio" name="q4" value="d"> &lt;a&gt;
                </label>
            </div>

            <div class="question">
                <h3><b>5. Which method selects an element by its ID?</b></h3>

                <label class="option">
                    <input type="radio" name="q5" value="a"> getElementById()
                </label>

                <label class="option">
                    <input type="radio" name="q5" value="b"> getElementsByClass()
                </label>

                <label class="option">
                    <input type="radio" name="q5" value="c"> queryAll()
                </label>

                <label class="option">
                    <input type="radio" name="q5" value="d"> getElement()
                </label>
            </div>

            <p id="message"></p>

            <div class="button-group">
                <button type="submit">Submit Quiz</button>

                <button type="button" id="restartBtn">
                    Restart Quiz
                </button>
            </div>

        </form>

        <div id="result">
            <h2>Quiz Result</h2>
            <h3 id="score"></h3>
            <p id="feedback"></p>
        </div>

    </div>

    <script>

        const quizForm = document.getElementById("quizForm");

        const message = document.getElementById("message");

        const result = document.getElementById("result");

        const scoreText = document.getElementById("score");

        const feedback = document.getElementById("feedback");

        const restartBtn = document.getElementById("restartBtn");

        const correctAnswers = {
            q1: "b",
            q2: "b",
            q3: "c",
            q4: "d",
            q5: "a"
        };

        quizForm.addEventListener("submit", function(event) {

            event.preventDefault();

            let score = 0;

            let answered = 0;

            for (let question in correctAnswers) {

                const selected = document.querySelector(
                    'input[name="' + question + '"]:checked'
                );

                if (selected) {

                    answered++;

                    if (selected.value === correctAnswers[question]) {
                        score++;
                    }
                }
            }

            if (answered < 5) {

                message.innerText =
                    "Please answer all 5 questions before submitting!";

                result.style.display = "none";

                return;
            }

            message.innerText = "";

            scoreText.innerText = "Your Score: " + score + "/5";

            if (score >= 4) {

                feedback.innerText =
                    "Excellent! You have a great understanding!";

            } else {

                feedback.innerText =
                    "Keep practising! You can improve your score.";

            }

            result.style.display = "block";

        });

        restartBtn.addEventListener("click", function() {

            quizForm.reset();

            result.style.display = "none";

            message.innerText = "";

        });

    </script>

</body>
</html>
