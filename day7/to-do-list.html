
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e40af;
        }

        #message {
            color: #dc2626;
            margin-bottom: 12px;
            font-size: 14px;
        }

        #taskCount {
            color: #475569;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        li.completed .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">Add Task</button>
        </div>

        <p id="message"></p>

        <p id="taskCount">Total Tasks: 0 | Pending: 0</p>

        <ul id="taskList"></ul>

    </div>

    <script>

        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const message = document.getElementById("message");
        const taskCount = document.getElementById("taskCount");

        function updateCount() {
            const total = taskList.children.length;

            const completed = taskList.querySelectorAll(
                "li.completed"
            ).length;

            const pending = total - completed;

            taskCount.innerText =
                "Total Tasks: " + total +
                " | Pending: " + pending;
        }

        function addTask() {

            const task = taskInput.value.trim();

            if (task === "") {
                message.innerText = "Please enter a task!";
                return;
            }

            message.innerText = "";

            const li = document.createElement("li");

            const span = document.createElement("span");
            span.className = "task-text";
            span.innerText = task;

            span.addEventListener("click", function() {
                li.classList.toggle("completed");
                updateCount();
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.innerText = "Delete";
            deleteBtn.className = "delete-btn";

            deleteBtn.addEventListener("click", function() {
                li.remove();
                updateCount();
            });

            li.appendChild(span);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            taskInput.value = "";

            updateCount();
        }

        addBtn.addEventListener("click", addTask);

        taskInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

    </script>

</body>
</html>
