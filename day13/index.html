
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Password Strength Checker</h1>
        <p class="subtitle">Check how strong your password is</p>

        <div class="input-group">
            <label for="password">Enter Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" id="togglePassword">Show</button>
            </div>
        </div>

        <div class="strength-bar">
            <div id="strengthIndicator"></div>
        </div>

        <p id="strengthMessage">Enter a password to check its strength.</p>

        <div class="requirements">
            <h3>Password Requirements</h3>
            <p id="length">✗ At least 8 characters</p>
            <p id="uppercase">✗ At least one uppercase letter</p>
            <p id="lowercase">✗ At least one lowercase letter</p>
            <p id="number">✗ At least one number</p>
            <p id="special">✗ At least one special character</p>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
        </div>

        <p id="matchMessage"></p>

        <button type="button" id="resetButton" class="reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
