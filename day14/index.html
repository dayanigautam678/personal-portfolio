
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper Scissors </h1>
        <p class="subtitle">Choose your move and beat the computer!</p>

        <div class="score-board">
            <div class="score-box">
                <span>You</span>
                <strong id="userScore">0</strong>
            </div>

            <div class="score-box">
                <span>Computer</span>
                <strong id="computerScore">0</strong>
            </div>
        </div>

        <h2>Make Your Choice</h2>

        <div class="choices">
            <button class="choice" data-choice="rock">
                
                <span>Rock</span>
            </button>

            <button class="choice" data-choice="paper">
                
                <span>Paper</span>
            </button>

            <button class="choice" data-choice="scissors">
                
                <span>Scissors</span>
            </button>
        </div>

        <div class="result-box">
            <p id="userChoice">Your Choice: -</p>
            <p id="computerChoice">Computer Choice: -</p>
            <h2 id="result">Let's Play!</h2>
            <p id="message">Select Rock, Paper, or Scissors.</p>
        </div>

        <button id="restartBtn">↻ Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
