
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>ShopEasy</h1>
            <div class="cart-info">
                🛒 Cart: <span id="cartCount">0</span>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to ShopEasy</h2>
        <p>Discover amazing products at great prices!</p>
    </section>

    <main class="container">
        <h2 class="section-title">Our Products</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <div class="product-grid" id="productGrid">

            <div class="product-card" data-name="Wireless Headphones">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
                <h3>Wireless Headphones</h3>
                <p class="price">₹1,499</p>
                <button class="add-btn" data-id="1">Add to Cart</button>
            </div>

            <div class="product-card" data-name="Smart Watch">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p class="price">₹2,499</p>
                <button class="add-btn" data-id="2">Add to Cart</button>
            </div>

            <div class="product-card" data-name="Running Shoes">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Running Shoes">
                <h3>Running Shoes</h3>
                <p class="price">₹1,999</p>
                <button class="add-btn" data-id="3">Add to Cart</button>
            </div>

            <div class="product-card" data-name="Backpack">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600" alt="Backpack">
                <h3>Backpack</h3>
                <p class="price">₹999</p>
                <button class="add-btn" data-id="4">Add to Cart</button>
            </div>

        </div>

        <section class="cart-section">
            <h2>🛒 Shopping Cart</h2>

            <div id="cartItems">
                <p class="empty-cart">Your cart is empty.</p>
            </div>

            <div class="total">
                Total: ₹<span id="totalPrice">0</span>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
