
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            transition: background-color 0.5s ease;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.07);
            opacity: 0.85;
        }

        .red { background: red; }
        .green { background: green; }
        .blue { background: blue; }
        .yellow { background: #e5b800; color: black; }
        .reset { background: #444; }
        .random { background: #8e44ad; }

        #selectedColor {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 23px;
            }

            button {
                flex: 1 1 40%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Background Color Changer</h1>

        <p>Click any button to change the background color.</p>

        <div class="buttons">
            <button class="red" data-color="red">Red</button>
            <button class="green" data-color="green">Green</button>
            <button class="blue" data-color="blue">Blue</button>
            <button class="yellow" data-color="yellow">Yellow</button>
            <button class="reset">Reset</button>
            <button class="random">Random Color</button>
        </div>

        <div id="selectedColor">Selected Color: Default</div>
    </div>

    <script>
        const originalColor = "#f4f4f4";
        const colorButtons = document.querySelectorAll("[data-color]");
        const resetButton = document.querySelector(".reset");
        const randomButton = document.querySelector(".random");
        const selectedColor = document.getElementById("selectedColor");

        function changeColor(color, name) {
            document.body.style.backgroundColor = color;
            selectedColor.textContent = "Selected Color: " + name;
        }

        colorButtons.forEach(function(button) {
            button.addEventListener("click", function() {
                const color = button.getAttribute("data-color");
                changeColor(color, color.charAt(0).toUpperCase() + color.slice(1));
            });
        });

        resetButton.addEventListener("click", function() {
            changeColor(originalColor, "Default");
        });

        randomButton.addEventListener("click", function() {
            const randomColor = "#" + Math.floor(Math.random() * 16777215)
                .toString(16).padStart(6, "0");

            changeColor(randomColor, randomColor.toUpperCase());
        });
    </script>

</body>
</html>
